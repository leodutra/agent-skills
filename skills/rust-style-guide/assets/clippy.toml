# The rust-style-guide clippy configuration: copy to each crate's root as clippy.toml (a crate without
# one inherits the workspace's). Each entry names the rule it holds and its SKILL.md section.
# Behavior: unwrap, expect, panic, dbg! and the print macros MAY appear in tests.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true
# Lints: public signatures are linted like private ones. In a workspace you rebuild, changing one is a
# refactor, not a breaking release (as with #[non_exhaustive] under Behavior). A crate published to
# users you don't rebuild leaves this line out.
avoid-breaking-exported-api = false
# `allow-invalid` keeps an entry quiet in a crate that does not depend on that library.
disallowed-types = [
  # Errors: libraries return typed errors; anyhow and eyre stay at process boundaries.
  # Library and domain crates only; a binary crate's own clippy.toml leaves these four out.
  # The Result aliases are listed apart: banning anyhow::Error does not catch anyhow::Result<T>.
  { path = "anyhow::Error", reason = "library code returns typed errors", allow-invalid = true },
  { path = "anyhow::Result", reason = "library code returns typed errors", allow-invalid = true },
  { path = "eyre::Report", reason = "library code returns typed errors", allow-invalid = true },
  { path = "eyre::Result", reason = "library code returns typed errors", allow-invalid = true },
  # Behavior: domain types hold no interior mutability. Domain crates only.
  { path = "std::cell::Cell", reason = "domain types hold no interior mutability" },
  { path = "std::cell::RefCell", reason = "domain types hold no interior mutability" },
  { path = "std::sync::Mutex", reason = "domain types hold no interior mutability" },
  { path = "std::sync::RwLock", reason = "domain types hold no interior mutability" },
]
disallowed-methods = [
  # Behavior: functions are total, so nothing relies on catching a panic (and panic=abort ignores it).
  { path = "std::panic::catch_unwind", reason = "return a typed error; do not rely on catching panics" },
  # Behavior: abort skips destructors and hides failure from callers.
  { path = "std::process::abort", reason = "return an error instead of aborting the process" },
  # Behavior: time and randomness are parameters, which keeps domain tests deterministic. Domain crates only.
  { path = "std::time::SystemTime::now", reason = "pass the time in" },
  { path = "std::time::Instant::now", reason = "pass the time in" },
  { path = "chrono::Utc::now", reason = "pass the time in", allow-invalid = true },
  { path = "rand::random", reason = "pass the source of randomness in", allow-invalid = true },
  # rand 0.9 renamed thread_rng to rng; both are listed.
  { path = "rand::rng", reason = "pass the source of randomness in", allow-invalid = true },
  { path = "rand::thread_rng", reason = "pass the source of randomness in", allow-invalid = true },
  # uuid's generators read the clock and randomness; new_v7(ts) takes its time as a parameter and stays.
  { path = "uuid::Uuid::new_v4", reason = "pass the id in", allow-invalid = true },
  { path = "uuid::Uuid::now_v7", reason = "pass the id in", allow-invalid = true },
]

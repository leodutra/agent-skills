# The rust-style-guide lints: paste into Cargo.toml (in a workspace, as [workspace.lints.rust] and
# [workspace.lints.clippy], with `lints.workspace = true` in each member). Each lint names what it
# catches, then the rule it holds and the SKILL.md section that rule lives in. The reasons, for
# people: references/fundamentals.md.
[lints.rust]
# Any `unsafe` at all. Lints: unsafe minimized. `forbid` cannot be lifted in code: a crate that
# truly needs unsafe sets this to "deny" and puts #[expect(unsafe_code, reason = "…")] on each item.
unsafe_code = "forbid"
# A public type without Debug. Refinements: every newtype and every error provides Debug.
missing_debug_implementations = "deny"

[lints.clippy]
# A `TryFrom` whose error is `Infallible`. Refinements: every input is valid, so implement `From`.
infallible_try_from = "deny"
# A fn returning `Result` or `Option` that only ever returns `Ok` or `Some`. Refinements: an error
# holds only the failures the fn can produce, so a fn that cannot fail returns the value itself.
unnecessary_wraps = "deny"
# A public fn returning `Result<_, ()>`. Errors: `()` MUST NOT be an error type.
result_unit_err = "deny"
# `.map_err(|_| …)`, which throws the cause away. Errors: translate an error and keep it as
# `#[source]` (or `#[from]`).
map_err_ignore = "deny"
# `r.ok();` as a statement, which only silences the unused `Result`. Types: `Result` means failure,
# so no `.ok()` drops an error.
unused_result_ok = "deny"
# `let _ = r` on a `#[must_use]` value: the same drop, and clippy's fix for the lint above. Same rule;
# where dropping is right (a send whose receiver may be gone), handle it or say why with
# #[expect(clippy::let_underscore_must_use, reason = "…")].
let_underscore_must_use = "deny"
# A struct with some `pub` and some private fields. Types: a newtype's field says what it is,
# `pub` for a tag and private for a refinement; a mix leaks the refinement's invariant.
partial_pub_fields = "deny"
# A type deriving PartialEq that could derive Eq. Refinements and Errors: Eq wherever it holds.
# Eq means reflexive (`a == a` for every value), which the compiler cannot check; this lint fires
# only when every field is Eq, so the derive it asks for is reflexive by construction.
derive_partial_eq_without_eq = "deny"
# `.unwrap()` outside tests. Behavior: no unwrap outside tests; functions are total.
unwrap_used = "deny"
# `.expect()` outside tests. Behavior: no expect outside tests (main.rs bootstrap under #[expect]).
expect_used = "deny"
# `panic!` outside tests. Behavior: no panic outside tests, none on valid input.
panic = "deny"
# `todo!()`, a placeholder that panics. Behavior: functions are total.
todo = "deny"
# `unimplemented!()`, a placeholder that panics. Behavior: functions are total.
unimplemented = "deny"
# `unreachable!()`. Behavior: prefer an exhaustive match, which the compiler checks.
unreachable = "deny"
# `assert!(r.is_err())` or `assert!(r.is_ok())`, which says only which variant `r` is not. Tests: a
# test asserts the specific error, `assert_eq!(r, Err(E::Variant))` (or the `Ok` value); clippy's
# suggested `r.unwrap_err()` asserts no more, so do not take it.
assertions_on_result_states = "deny"
# `_ =>` over several variants of an enum. Behavior: match exhaustively, so a new variant breaks the build.
# On another crate's #[non_exhaustive] enum, list every known variant before `_`, or use `matches!`
# or `if let` when only a few matter.
wildcard_enum_match_arm = "deny"
# `_ =>` standing for a single variant, which the lint above skips. Same rule.
match_wildcard_for_single_variants = "deny"
# A std `MutexGuard` held across `.await`. Behavior: never hold one across an await.
await_holding_lock = "deny"
# A `RefCell` borrow held across `.await`. Behavior: the same hazard, and no interior mutability.
await_holding_refcell_ref = "deny"
# A future that is not `Send`. Behavior: a future spawned multithreaded must be Send.
future_not_send = "deny"
# `let _ = future` discards an unpolled future. Async: await, return or spawn it deliberately.
let_underscore_future = "deny"
# `x as u32` from a wider integer, which silently truncates. Behavior: functions are total, so a
# narrowing conversion is `u32::try_from(x)` with its error handled (widening is `From`).
cast_possible_truncation = "deny"
# `x as u64` from a signed integer, which turns a negative value into a huge one. Same rule.
cast_sign_loss = "deny"
# `x as i64` from an unsigned integer of the same size, which wraps a large value negative. Same rule.
cast_possible_wrap = "deny"
# `&s[a..b]` on a `str`, which panics when an index falls inside a UTF-8 character. Behavior:
# functions are total; use `split_once`, `char_indices` or `get(a..b)`. `split_at` is review's.
string_slice = "deny"
# `for` loops over a hash collection. Behavior: domain decisions and output need stable order.
# Iterator chains such as `map.keys().collect()` are still a review check.
iter_over_hash_type = "deny"
# A parameter taken by value but never consumed. Lints: borrow inputs when ownership is not required.
needless_pass_by_value = "deny"
# A `&Option<T>` parameter. Lints: borrow the data, so take `Option<&T>` (clippy already flags
# `&String`, `&Vec` and `&Box` by default).
ref_option = "deny"
# `Option<Option<T>>`. Types: absence is an `Option` with one meaning, or a variant that names each.
option_option = "deny"
# A clone whose original is never used again. Lints: borrow rather than clone when ownership stays.
redundant_clone = "deny"
# A glob import (`use foo::*`) other than `use super::*` in a test module or a prelude. Lints:
# every name says where it comes from.
wildcard_imports = "deny"
# `.for_each(…)` where a `for` loop reads plainer. Lints: a loop over combinators that only hide it.
needless_for_each = "deny"
# A struct with more than three bools. Types: exclusive states are one enum, not bool flags.
struct_excessive_bools = "deny"
# A function with more than three bool parameters. Same rule, at the call site.
fn_params_excessive_bools = "deny"
# The types clippy.toml bans. Errors (no anyhow or eyre in libraries); Behavior (no interior mutability).
disallowed_types = "deny"
# The functions clippy.toml bans. Behavior: no abort; time and randomness are domain inputs.
disallowed_methods = "deny"
# Library code never terminates its caller; `exit` permits calls in `main` only.
exit = "deny"
# Debug and print macros do not belong in library code. Binary and build-script targets that
# deliberately print use a reasoned #[expect] at the printing site.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# An `unsafe` block without a `// SAFETY:` comment. Lints: every unsafe block documents its invariants.
undocumented_unsafe_blocks = "deny"
# A bare `#[allow]`. Lints: silence with `#[expect]`, which fails once the lint no longer fires.
allow_attributes = "deny"
# A silencing attribute with no `reason`. Lints: a tool's verdict is never waved away without saying why.
allow_attributes_without_reason = "deny"

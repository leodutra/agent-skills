schema_version: "1.1"
name: review-published-crate
expected_outcome: |
  A precision case: most of the crate follows the skill, including the exceptions it allows, so
  most graders check that review.md does not flag them. Four real defects: InvalidToken echoes the
  secret it rejected; Window::Between's public variant fields admit an inverted window; the pub
  const literal can panic at run time in crates that depend on this published one; main.rs
  expect()s the CLI argument, which is user input, not bootstrap. review.md does not flag
  #[non_exhaustive] on a published crate's error, StoreError's missing Clone/Eq (it wraps
  io::Error), latest's Result<Option<Reading>, StoreError>, or the unit-struct ZeroInterval.
context:
  scaffold_script: place-files.sh

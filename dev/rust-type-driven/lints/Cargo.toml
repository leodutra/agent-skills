[package]
name = "rust_type_driven_lints"
version = "0.1.0"
description = "Type-aware checks for skills/rust-type-driven: what clippy and ast-grep cannot see"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "21baba9c10c5d179915cae82e6247bc2337872fb" }
dylint_linting = "6.0"

[package.metadata.rust-analyzer]
rustc_private = true

# Managed by stack-init (claude-context-stack, D62). Overrides ONLY connection_prompt;
# every other prompt falls back to Serena's built-in templates.
prompts:
  connection_prompt: |
    Serena = LSP-backed code tools. It starts idle: no project, no language server. Boot it only when a task reads, searches or edits code: load its deferred tools in ONE call - ToolSearch "select:mcp__serena__activate_project,mcp__serena__find_symbol,mcp__serena__find_referencing_symbols,mcp__serena__get_symbols_overview,mcp__serena__get_diagnostics_for_file,mcp__serena__replace_symbol_body,mcp__serena__insert_after_symbol,mcp__serena__insert_before_symbol,mcp__serena__rename_symbol" - then call activate_project with the repo root (the SessionStart hook names it). Activation starts the language server, so skip it for docs/config-only work. Once active, in code files: get_symbols_overview / find_symbol (include_body) instead of reading whole files; find_referencing_symbols instead of grepping for a name; replace_symbol_body / insert_*_symbol / rename_symbol instead of text edits of whole symbols; get_diagnostics_for_file instead of a full type-check. Docs, config and plain text: your own tools.
